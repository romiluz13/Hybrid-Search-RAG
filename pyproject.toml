[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mongodb-hybridrag"
version = "0.3.0"
description = "MongoDB-native AI application starter with hybrid search, graphs, and live validation"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "MongoDB", email = "devrel@mongodb.com" }]
keywords = [
  "rag",
  "retrieval-augmented-generation",
  "mongodb",
  "atlas",
  "vector-search",
  "voyage-ai",
  "knowledge-graph",
  "llm",
  "ai",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Database",
  "Typing :: Typed",
]
dependencies = [
  # Core
  "certifi>=2024.2.2",        # TLS CA bundle — fixes macOS+python.org Atlas SSL failures
  "numpy>=1.24.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",

  # Voyage AI
  "voyageai>=0.3.0",

  # Anthropic
  "anthropic>=0.39.0",

  # OpenAI
  # OpenAI (>=1.45.0 required for max_completion_tokens; used by grove/openai gateways)
  "openai>=1.45.0",

  # Google Gemini
  "google-genai>=0.2.0",

  # MongoDB
  "pymongo>=4.7.0,<5.0",
  "motor>=3.4.0,<4.0",

  # Async and processing
  "tiktoken>=0.8.0",
  "tenacity>=9.0.0",
  "aioboto3>=13.2.0",
  "aiohttp>=3.11.9",
  "httpx>=0.27.0",
  "json_repair>=0.54.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.109.0", "uvicorn>=0.27.0"]
ui = ["chainlit>=1.0.0", "pymupdf>=1.23.0"]
cli = ["rich>=13.0.0", "typer>=0.9.0"]
ingestion = [
  "docling>=2.0.0",
  "docling-core>=2.0.0",
  "transformers>=4.30.0",
  "tavily-python>=0.3.0", # Tavily web scraping
]
observability = ["langfuse>=2.0.0"]
evaluation = ["ragas>=0.2.0", "datasets>=2.14.0", "langchain-openai>=0.2.0"]
agent = [
  "langchain-core>=0.3.0",
  "langchain-anthropic>=0.3.0",
  "langgraph>=0.2.0",
]
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=4.0.0",
  "black>=24.0.0",
  "isort>=5.13.0",
  "mypy>=1.8.0",
  "ruff>=0.2.0",
]
all = [
  "mongodb-hybridrag[api,ui,cli,ingestion,observability,evaluation,agent,dev]",
]

[project.scripts]
hybridrag = "hybridrag.cli:run_cli"

[project.urls]
Homepage = "https://github.com/romiluz13/Hybrid-Search-RAG"
Documentation = "https://github.com/romiluz13/Hybrid-Search-RAG#readme"
Repository = "https://github.com/romiluz13/Hybrid-Search-RAG"
Issues = "https://github.com/romiluz13/Hybrid-Search-RAG/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 88
target-version = ["py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["hybridrag"]
skip = [".venv", "venv", "build", "dist"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["venv", ".venv", "build", "dist"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
  "p1: high priority test cases (critical functionality)",
  "p2: medium priority test cases (important features)",
  "p3: low priority test cases (edge cases, nice-to-have)",
  "integration: requires MongoDB connection and external services",
  "benchmark: performance benchmark tests (excluded from regular runs)",
]

[tool.coverage.run]
source = ["src/hybridrag"]
omit = ["*/tests/*", "*/__pycache__/*", "*/engine/api/*", "*/.venv/*"]

[tool.coverage.report]
precision = 2
show_missing = true
# No fail_under gate: the repo includes a large vendored engine/ subtree with
# limited direct test coverage, so a fixed percentage gate is unreliable.
# Coverage is still reported (show_missing=true) for visibility.
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"
title = "HybridRAG Test Coverage Report"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP", # pyupgrade
]
ignore = [
  "E501", # line too long (handled by formatter)
  "B008", # do not perform function calls in argument defaults (required for Typer/FastAPI)
  "B023", # function definition does not bind loop variable (false positives with constants)
]

[tool.ruff.lint.isort]
known-first-party = ["hybridrag"]

[tool.ruff.lint.per-file-ignores]
"src/hybridrag/ui/chat.py" = ["E402"] # sys.path manipulation before imports
