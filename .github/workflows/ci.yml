name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'ruff==0.11.6' 'mypy>=1.10.0'

      - name: Run ruff check
        run: ruff check src/hybridrag tests

      - name: Run ruff format check
        run: ruff format --check src/hybridrag tests

      # mypy is non-blocking: 340+ pre-existing type errors are tracked for a
      # separate cleanup (see .pre-commit-config.yaml note). Kept advisory-only
      # so CI stays green while types are improved incrementally.
      - name: Run mypy (advisory, non-blocking)
        continue-on-error: true
        run: mypy src/hybridrag --ignore-missing-imports

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Run unit tests
        run: |
          pytest tests/ -v -m "not integration" \
            --ignore=tests/benchmarks/ \
            --ignore=tests/e2e_real_test.py \
            --cov=src/hybridrag \
            --cov-report=xml \
            --cov-report=term

      - name: Run example and API smoke tests
        run: |
          pytest tests/examples/ tests/api/test_query_api_features.py -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    services:
      mongodb:
        image: mongodb/mongodb-atlas-local:preview
        ports:
          - 27018:27017
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Run integration tests
        env:
          MONGODB_URI: mongodb://localhost:27018/?directConnection=true
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.4
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_EXTRA_HEADERS: ${{ secrets.OPENAI_EXTRA_HEADERS }}
        run: |
          pytest tests/integration/ -v -m integration

  build:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
