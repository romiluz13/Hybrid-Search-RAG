name: Droid Wiki Refresh

on:
  push:
    branches: [main]

jobs:
  wiki-refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Factory Droid
        run: curl -fsSL https://app.factory.ai/cli | sh

      - name: Configure Grove model
        run: |
          mkdir -p ~/.factory
          cat > ~/.factory/settings.json << 'JSONEOF'
          {
            "customModels": [
              {
                "id": "custom:Grove-Claude-Sonnet-5-0",
                "index": 0,
                "displayName": "Grove Claude Sonnet 5",
                "provider": "anthropic",
                "baseUrl": "https://grove-gateway-prod.azure-api.net/grove-foundry-prod/anthropic",
                "model": "claude-sonnet-5",
                "apiKey": "${{ secrets.GROVE_API_KEY }}",
                "extraHeaders": {
                  "api-key": "${{ secrets.GROVE_API_KEY }}"
                },
                "maxOutputTokens": 64000,
                "noImageSupport": false
              }
            ]
          }
          JSONEOF

      - name: Generate wiki
        run: droid exec --auto high --model "custom:Grove-Claude-Sonnet-5-0" "/wiki"
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
