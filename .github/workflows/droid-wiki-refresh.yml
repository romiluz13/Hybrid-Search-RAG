name: Droid Wiki Refresh

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'examples/**'
      - 'notebooks/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - 'pyproject.toml'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  wiki-refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Factory Droid
        run: curl -fsSL https://app.factory.ai/cli | sh

      - name: Configure git identity
        run: |
          git config --global user.name "Droid Wiki Bot"
          git config --global user.email "actions@github.com"

      - name: Configure Grove model
        run: |
          mkdir -p ~/.factory
          cat > ~/.factory/settings.json << 'JSONEOF'
          {
            "customModels": [
              {
                "id": "custom:Grove-GLM-5.2-Fireworks-0",
                "index": 0,
                "displayName": "Grove GLM 5.2 Fireworks",
                "provider": "generic-chat-completion-api",
                "baseUrl": "https://grove-gateway-prod.azure-api.net/grove-foundry-prod/openai/v1",
                "model": "FW-GLM-5.2",
                "apiKey": "${{ secrets.GROVE_API_KEY }}",
                "extraHeaders": {
                  "api-key": "${{ secrets.GROVE_API_KEY }}"
                },
                "maxOutputTokens": 32768,
                "noImageSupport": true
              }
            ]
          }
          JSONEOF

      - name: Generate wiki
        run: droid exec --skip-permissions-unsafe --model "custom:Grove-GLM-5.2-Fireworks-0" "/wiki"
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
