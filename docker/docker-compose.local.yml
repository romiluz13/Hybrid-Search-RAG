# Docker Compose for Local MongoDB Atlas Development
# Uses mongodb-atlas-local image which provides Atlas Search + Vector Search locally.
# NOTE: atlas-local ignores MONGODB_INITDB_ROOT_* env vars -- it runs without auth.
# Usage: docker-compose -f docker/docker-compose.local.yml up -d

version: '3.8'

services:
  mongodb:
    image: mongodb/mongodb-atlas-local:8.0
    container_name: hybridrag-mongodb-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      - MONGODB_INITDB_DATABASE=hybridrag
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - hybridrag-network

volumes:
  mongodb-data:
    driver: local
  mongodb-config:
    driver: local

networks:
  hybridrag-network:
    driver: bridge

# Connection URI for .env:
# MONGODB_URI=mongodb://localhost:27017/?directConnection=true
#
# Quick Commands:
# Start:    docker-compose -f docker/docker-compose.local.yml up -d
# Stop:     docker-compose -f docker/docker-compose.local.yml down
# Logs:     docker-compose -f docker/docker-compose.local.yml logs -f
# Destroy:  docker-compose -f docker/docker-compose.local.yml down -v
